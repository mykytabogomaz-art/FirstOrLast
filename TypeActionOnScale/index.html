<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажер часу — повзунки</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f7;--card:#fff;--ink:#1e2433;--mut:#667085;--line:#cfd6e4;--knob:#3b6fe0;--ok:#16a34a;--bad:#dc2626;
--p0:#e3e8fb;--p1:#fdebd3;--p2:#fff6c7;--p3:#fbdcec;--btn:#1e2433;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--ink:#e8ecf5;--mut:#9aa4b8;--line:#3a4259;--knob:#6b95ff;--p0:#1f2650;--p1:#4a3519;--p2:#4a4519;--p3:#4a1f39;--btn:#e8ecf5;--btnink:#12151d}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b2030;--ink:#e8ecf5;--mut:#9aa4b8;--line:#3a4259;--knob:#6b95ff;--p0:#1f2650;--p1:#4a3519;--p2:#4a4519;--p3:#4a1f39;--btn:#e8ecf5;--btnink:#12151d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
.game{max-width:1104px;margin:0 auto;height:max(700px,calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));background:var(--card);border-radius:18px;padding:14px;display:flex;gap:18px;box-shadow:0 2px 14px rgba(20,30,60,.12)}
.top{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.top span{color:var(--mut);font-weight:700;font-size:14px}
#task{margin:0;font-size:19px;line-height:1.65;font-weight:700}
#task b{background:var(--p2);padding:0 5px;border-radius:5px;color:var(--ink)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px 14px;background:var(--btn);color:var(--btnink);cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,.knob:focus-visible{outline:3px solid var(--knob);outline-offset:2px}
#msg{font-weight:700;font-size:14px;color:var(--mut)}
.left{flex:1;min-width:0;display:flex;flex-direction:column;gap:24px;overflow-y:auto;padding:12px 10px 0 26px}
.board{flex:none;width:524px;display:flex}
.vsep{flex:none;width:2px;border-radius:1px;background:var(--line)}
.rail{position:relative;flex:none;width:224px;touch-action:none}
.rail::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;border-radius:3px;background:var(--line)}
/* knob is anchored by its right edge, so it grows to the left when a word is typed */
.knob{position:absolute;right:10px;top:0;height:20px;padding:0 9px;gap:5px;display:flex;align-items:center;justify-content:flex-end;border-radius:999px;background:var(--knob);color:#fff;font-weight:800;font-size:12px;white-space:nowrap;cursor:grab;touch-action:none;user-select:none;transition:transform .12s,background-color .2s;box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:2}
.knob.drag{cursor:grabbing;z-index:3;transition:background-color .2s}
.knob.ok{background:var(--ok)}
.tm{flex:none}
.ic{flex:none;width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.32);font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ic:hover{background:rgba(255,255,255,.55)}
.wd{display:none}
.knob.edit .wd{display:inline-grid;align-self:stretch;margin:2px 0;max-width:122px}
.wd::after{content:attr(data-v) " ";visibility:hidden;grid-area:1/1;white-space:pre;padding:0 8px;font:inherit;overflow:hidden}
.wd input{grid-area:1/1;width:100%;min-width:0;font:inherit;font-weight:700;color:#1e2433;background:#fff;border:0;border-radius:999px;padding:0 8px;outline:0;user-select:text;cursor:text}
.wd input::placeholder{color:#667085;font-weight:600}
.wd input:focus{box-shadow:inset 0 0 0 2px var(--knob)}
.table{flex:1;min-width:0;display:grid;grid-template-columns:1fr 78px;grid-template-rows:repeat(27,1fr);border:1px solid var(--line);border-left:0;border-radius:0 10px 10px 0;overflow:hidden}
.table>div{display:flex;align-items:center;padding:0 10px;font-size:13px;border-top:1px solid rgba(128,138,160,.25);min-height:0;min-width:0}
.table>.hd{border-top:0;font-weight:800;color:var(--mut);background:var(--card);flex-direction:column;justify-content:center;align-items:flex-start;gap:4px}
.hd small{font-weight:600;font-size:11px;line-height:1.25}
.top .stars{display:flex;gap:2px;font-size:24px;line-height:1}
.top .stars span{color:var(--line);font-size:32px;transition:color .3s}
.top .stars span.on{color:#f5b700}
.table>.pc{grid-column:2;justify-content:center;text-align:center;flex-direction:column;gap:2px;font-weight:800;font-size:12px;border-left:1px solid rgba(128,138,160,.35);padding:0 4px}
.table>.pc span{font-size:20px;line-height:1}
.table>.hr{grid-column:1;gap:8px}
.hr b{font-weight:800;min-width:42px}
.p0{background:var(--p0)}.p1{background:var(--p1)}.p2{background:var(--p2)}.p3{background:var(--p3)}
.hr.hit{box-shadow:inset 4px 0 0 var(--knob)}
#ask{margin:0 0 6px;font-size:20px;font-weight:800}
.answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800}
#reply{flex:1 1 240px;min-width:0;font:inherit;font-weight:700;font-size:16px;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
#reply:focus-visible{outline:3px solid var(--knob);outline-offset:2px}
#reply:disabled{opacity:.9}
#reply.okk{border-color:var(--ok)}#reply.badd{border-color:var(--bad)}
@media (max-width:900px){.game{flex-direction:column;height:auto}.left{overflow:visible}.board{width:100%;height:760px}.rail{width:124px}.knob.edit .wd{max-width:58px}.vsep{width:100%;height:2px}}
@media (prefers-reduced-motion:reduce){.knob{transition:none}}
@media (max-width:420px){.table{grid-template-columns:1fr 62px}.table>div{padding:0 6px;font-size:12px}.hr b{min-width:38px}.top .stars span{font-size:24px}}
</style>
</head>
<body>
<div class="game">
  <div class="left">
  <div class="top"><div id="qn"></div><div class="stars" id="stars"></div></div>
  <p id="task"></p>
  <p id="ask"></p>
  <div class="answer" id="answerRow"><label for="reply">Відповідь:</label><input id="reply" type="text" maxlength="60" autocomplete="off" autocapitalize="sentences" spellcheck="false"></div>
  <div class="bar"><button id="check">Перевірити</button><button id="next" disabled>Наступне питання</button><span id="msg"></span></div>
  </div>
  <div class="vsep"></div>
  <div class="board"><div class="rail" id="rail"></div><div class="table" id="table"></div></div>
</div>
<script>
const NAMES=["північ","перша ночі","друга ночі","третя ночі","четверта ранку","п'ята ранку","шоста ранку","сьома ранку","восьма ранку","дев'ята ранку","десята ранку","одинадцята ранку","дванадцята дня","перша дня","друга дня","третя дня","четверта дня","п'ята вечора","шоста вечора","сьома вечора","восьма вечора","дев'ята вечора","десята вечора","одинадцята вечора"];
const PERIODS=[["🌙","ніч",0,4],["🌅","ранок",4,12],["☀️","день",12,17],["🌇","вечір",17,24]];
// events are listed chronologically; ranges never overlap -> times differ by at least 1 hour
const SC=[
["Розклад Оленки:",[["сніданок","m",[7,8]],["прогулянка","f",[11,14]],["вечеря","f",[18,20]]]],
["Школа Івана:",[["урок","m",[8,9]],["обід","m",[12,13]],["гурток","m",[15,17]]]],
["У дитячому таборі:",[["зарядка","f",[7,8]],["купання","n",[11,14]],["дискотека","f",[19,21]]]],
["Вихідний день родини:",[["кіно","n",[10,12]],["обід","m",[13,14]],["прогулянка","f",[16,19]]]],
["Подорож потягом:",[["відправлення","n",[1,5]],["обід","m",[11,14]],["прибуття","n",[17,22]]]],
["Розклад тата:",[["робота","f",[8,9]],["футбол","m",[18,19]],["казка","f",[20,22]]]],
["На фермі:",[["годування","n",[6,7]],["полуденок","m",[14,16]],["вечеря","f",[18,20]]]],
["У лікарні:",[["обхід","m",[8,9]],["обід","m",[12,14]],["відвідування","n",[16,18]]]],
["Вечір у бабусі:",[["чаювання","n",[15,16]],["вечеря","f",[18,19]],["казка","f",[21,22]]]],
["Екскурсія:",[["збір","m",[8,9]],["пікнік","m",[12,14]],["повернення","n",[18,20]]]]
];
const VERB={m:"був",f:"була",n:"було"};
const $=id=>document.getElementById(id);
const rail=$("rail"),table=$("table"),N=SC.length,GOAL=7,reply=$("reply");
reply.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("check").click()}});
reply.addEventListener("input",()=>{if(!locked)reply.className=""});
let q=0,score=0,knobs=[],locked=false,drag=null,rowH=0,rows=[],ans=null,tries=0,order=[],last=-1;
const pad=h=>String(h).padStart(2,"0")+":00";
const per=h=>PERIODS.findIndex(p=>h>=p[2]&&h<p[3]);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const norm=t=>t.trim().toLowerCase().replace(/[’ʼ`]/g,"'");
// only the last word of the sentence is checked; capital letters, extra spaces and punctuation are ignored
const normAns=t=>norm(t).replace(/[.,!?;:]+/g," ").replace(/\s+/g," ").trim();
const lastWord=t=>normAns(t).split(" ").pop();

// table: 2 columns; column 2 has just 4 cells (ніч, ранок, день, вечір); fills the whole board height
table.innerHTML='<div class="hd" style="grid-area:1/1/4/2"><b>Година</b><small>Перетягни повзунок на годину. Натисни ✎, щоб дописати, що тоді було</small></div><div class="hd" style="grid-area:1/2/4/3;align-items:center;text-align:center">Пора доби</div>';
for(let h=0;h<24;h++){
  const r=document.createElement("div");r.className="hr p"+per(h);r.style.gridRow=h+4;
  r.innerHTML=`<b>${pad(h)}</b><span>${NAMES[h]}</span>`;
  table.appendChild(r);rows.push(r);
}
PERIODS.forEach(([e,n,a,b],i)=>{
  const c=document.createElement("div");c.className="pc p"+i;c.style.gridRow=`${a+4} / ${b+4}`;
  c.innerHTML=`<span>${e}</span>${n}`;table.appendChild(c);
});

function pos(k){
  const y=(k.idx===0?k.lane:k.idx+2)*rowH+2; // parked knobs sit one under another above the hours
  k.el.style.transform=`translateY(${y}px)`;
  k.el.style.height=(rowH-4)+"px";
  k.el.style.fontSize=Math.max(9,Math.min(13,rowH-9))+"px";
}
function measure(){rowH=rail.clientHeight/27;knobs.forEach(pos)}
new ResizeObserver(measure).observe(rail);

function refresh(){
  rows.forEach(r=>r.classList.remove("hit"));
  knobs.forEach(k=>{
    k.el.classList.toggle("ok",k.idx>0&&k.idx-1===k.h);
    if(k.idx>0)rows[k.idx-1].classList.add("hit");
  });
}
function stars(){$("stars").innerHTML=Array.from({length:GOAL},(_,i)=>`<span class="${i<score?"on":""}">★</span>`).join("");$("stars").setAttribute("aria-label",`Зірок: ${score} з ${GOAL}`)}
// questions come in random order and start over (reshuffled) if the child needs more than 10
function nextScenario(){
  if(!order.length){order=shuffle(SC.map((_,i)=>i));if(order[0]===last)order.push(order.shift())}
  return last=order.shift();
}
function openWord(k){if(locked)return;k.el.classList.add("edit");k.inp.focus()}

function build(){
  rail.innerHTML="";rows.forEach(r=>r.classList.remove("hit","ans"));
  locked=false;$("msg").textContent="";
  $("check").disabled=false;$("next").disabled=true;$("next").textContent="Наступне питання";
  const [intro,evs]=SC[nextScenario()];
  const items=evs.map(([n,g,[a,b]])=>({n,g,h:a+Math.floor(Math.random()*(b-a+1))}));
  const sorted=[...items].sort((x,y)=>x.h-y.h);
  const mode=Math.random()<.5?"first":"last";
  ans={mode,item:mode==="first"?sorted[0]:sorted[2]};
  const shown=shuffle(items);
  $("task").innerHTML=intro+"<br>"+shown.map(e=>`${e.n} о <b>${pad(e.h)}</b>`).join(",<br>")+".";
  $("ask").textContent=mode==="first"?"Що було першим?":"Що було останнім?";
  $("answerRow").style.display="";reply.value="";reply.disabled=false;reply.className="";tries=0;
  $("qn").textContent=`Питання ${q+1}`;stars();
  const lanes=shuffle([0,1,2]);
  knobs=shown.map((it,i)=>{
    const el=document.createElement("div");el.className="knob";el.tabIndex=0;
    // [word input][icon][time] — the icon stays right before the time, the input grows to the left
    el.innerHTML=`<span class="wd" data-v=""><input maxlength="14" autocomplete="off" placeholder="що було?" aria-label="Що було о ${pad(it.h)}?"></span><b class="ic" role="button" aria-label="Дописати дію" title="Дописати, що відбувалось">✎</b><span class="tm">${pad(it.h)}</span>`;
    rail.appendChild(el);
    const k={h:it.h,idx:0,lane:lanes[i],el,word:it.n,inp:el.querySelector("input"),wd:el.querySelector(".wd"),ic:el.querySelector(".ic")};
    k.sync=()=>{k.wd.dataset.v=k.inp.value||k.inp.placeholder};
    k.sync();
    k.inp.addEventListener("input",k.sync);
    k.inp.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter")k.inp.blur()});
    k.inp.addEventListener("blur",()=>{if(!locked&&!k.inp.value.trim())el.classList.remove("edit")});
    k.ic.addEventListener("click",()=>openWord(k));
    el.addEventListener("pointerdown",e=>{if(locked||e.target.closest(".ic,input"))return;el.setPointerCapture(e.pointerId);drag=k;el.classList.add("drag")});
    el.addEventListener("pointermove",e=>{
      if(drag!==k)return;
      const y=e.clientY-rail.getBoundingClientRect().top;
      const r=Math.max(0,Math.min(26,Math.floor(y/rowH)));move(k,r<3?0:r-2);
    });
    const up=()=>{drag=null;el.classList.remove("drag")};
    el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
    el.addEventListener("keydown",e=>{
      if(locked||e.target!==el)return;
      if(e.key==="Enter"){e.preventDefault();openWord(k);return}
      const d=e.key==="ArrowDown"?1:e.key==="ArrowUp"?-1:0;
      if(d){e.preventDefault();move(k,Math.max(0,Math.min(24,k.idx+d)))}
    });
    return k;
  });
  measure();refresh();
}
function move(k,i){
  if(i===k.idx)return;
  if(i>0&&knobs.some(o=>o!==k&&o.idx===i))return; // knobs never hide each other
  k.idx=i;pos(k);refresh();
}

$("check").onclick=()=>{
  if(locked)return;
  const typed=reply.value.trim();
  if(!typed){$("msg").textContent="Напиши відповідь у полі.";reply.focus();return}
  const want=[ans.mode==="first"?"Першим":"Останнім",VERB[ans.item.g],ans.item.n].join(" ");
  const good=lastWord(typed)===lastWord(want);
  if(!good&&tries===0){ // first mistake: nothing is revealed, the child may fix the answer
    tries=1;
    reply.className="badd";reply.focus();
    $("msg").textContent="Не зовсім. Виправ помилку й натисни «Перевірити» ще раз.";
    return;
  }
  locked=true;
  reply.disabled=true;reply.className=good?"okk":"badd";
  knobs.forEach(k=>{k.inp.readOnly=true}); // the check looks only at the sentence, knobs are not graded
  if(good){score=Math.min(GOAL,score+1);$("msg").textContent=tries?"Тепер правильно! 👍":"Правильно! 🎉"}
  else{const lose=score>0;score=Math.max(0,score-1);$("msg").textContent=`Правильна відповідь: ${want}.`+(lose?" Одну зірочку забрано.":"")}
  stars();
  $("check").disabled=true;$("next").disabled=false;
  if(score>=GOAL)$("next").textContent="Завершити";
};
$("next").onclick=()=>{
  const t=$("next").textContent;
  if(t==="Завершити"){
    $("task").textContent=`Вітаю! Усі зірки зібрано! 🎉 Питань пройдено: ${q+1}.`;
    $("qn").textContent="Готово";$("msg").textContent="";$("ask").textContent="";
    rail.innerHTML="";knobs=[];rows.forEach(r=>r.classList.remove("hit","ans"));
    reply.value="";reply.disabled=true;reply.className="";$("answerRow").style.display="none";
    $("next").textContent="Грати знову";$("check").disabled=true;return;
  }
  if(t==="Грати знову"){q=0;score=0;order=[];build();return}
  q++;build();
};
build();
</script>
</body>
</html>

</body></html>
